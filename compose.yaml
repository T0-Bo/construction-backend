services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_GID: ${HOST_GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    command: php artisan queue:work database --sleep=3 --tries=3 --backoff=10 --timeout=90
    restart: unless-stopped
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_backend}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql_data:
  redis_data:
